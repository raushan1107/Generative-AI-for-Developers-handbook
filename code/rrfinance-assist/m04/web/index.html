<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RR Finance Assist</title>
<style>
  :root { --bg: #0d1220; --panel: #151b2e; --ink: #e8ebf5; --muted: #8b95ad; --accent: #8d7bff; --you: #2a3354; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 760px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 0 16px; }
  header b { font-size: 18px; }
  header span { color: var(--muted); font-size: 13px; }
  header button { margin-left: auto; background: none; border: 1px solid #2c3554; color: var(--muted); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  #log { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.55; white-space: pre-wrap; }
  .you { align-self: flex-end; background: var(--you); }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid #222a44; }
  .bot.error { border-color: #a33a52; color: #ffb3c1; }
  .meta { align-self: flex-start; font-size: 12px; color: var(--muted); margin-top: -4px; }
  .tool { align-self: flex-start; font-size: 12px; color: var(--muted); font-style: italic; }
  header select { background: var(--panel); color: var(--ink); border: 1px solid #2c3554; border-radius: 8px; padding: 5px 8px; }
  form { display: flex; gap: 8px; padding-top: 12px; }
  input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #2c3554; background: var(--panel); color: var(--ink); font: inherit; }
  form button { padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<div class="wrap">
  <header><b>RR Finance Assist</b><span>customer support · milestone 4</span>
    <button id="reset" type="button">New chat</button>
    <label><span>Demo sign-in</span> <select id="who"><option value="">Not signed in</option></select></label></header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Ask about your card, account, payments or fees..." required>
    <button id="send">Send</button>
  </form>
</div>
<script>
  let sessionId = crypto.randomUUID();
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function add(cls, text) {
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function handle(event, bubble) {
    if (event.type === "tool") {                       // new in milestone 4: show what the assistant is doing
      const el = document.createElement("div");
      el.className = "tool";
      el.textContent = event.label + "…";
      log.insertBefore(el, bubble);
    }
    else if (event.type === "delta") bubble.textContent += event.text;
    else if (event.type === "replace") bubble.textContent = event.text;
    else if (event.type === "error") { bubble.textContent = event.message; bubble.classList.add("error"); }
    else if (event.type === "done") {
      const tools = event.tools && event.tools.length ? ` · tools: ${event.tools.join(", ")}` : "";
      add("meta", `first word ${event.ttft_s}s · total ${event.total_s}s · ${event.tokens_in ?? "?"} in / ${event.tokens_out ?? "?"} out${tools}`);
    }
    log.scrollTop = log.scrollHeight;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    send.disabled = true;
    add("msg you", text);
    const bubble = add("msg bot", "");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text, customer_id: who.value || null }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buffer.indexOf("\n\n")) >= 0) {        // SSE events end with a blank line
          const raw = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          if (raw.startsWith("data: ")) handle(JSON.parse(raw.slice(6)), bubble);
        }
      }
    } catch (err) {
      handle({ type: "error", message: "Couldn't reach RR Finance Assist (" + err.message + ")." }, bubble);
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  // Demo sign-in: a real app gets the customer from its login, on the server.
  const who = document.getElementById("who");
  fetch("/api/demo-customers").then(r => r.json()).then(list => {
    for (const l of list) who.add(new Option(l.name, l.customer_id));
  });
  who.addEventListener("change", () => document.getElementById("reset").click());

  document.getElementById("reset").addEventListener("click", async () => {
    await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ session_id: sessionId }) });
    sessionId = crypto.randomUUID();
    log.innerHTML = "";
  });
</script>
</body>
</html>
